version: 2

before:
  # Plain-string hooks (OSS goreleaser). The {cmd,dir} map form is PRO-only and
  # `goreleaser check` rejects it on the OSS distribution. --prefix runs npm
  # against web/package.json (build writes to web/dist, which is gitignored).
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: drumdrop
    main: ./cmd/drumdrop
    binary: drumdrop
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=webui
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: drumdrop
    name_template: "drumdrop_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: elienop
    name: drumdrop
