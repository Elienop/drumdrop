services:
  drumdrop:
    build: .
    container_name: drumdrop-dev
    ports:
      - "3737:8080"
    volumes:
      - drumdrop-config:/config
      - ./downloads:/downloads        # scratch for in-progress downloads
      # Optional library (DRUMDROP_LIBRARY_DIR below): for an instant, atomic move
      # (a plain rename) downloads and library must be ONE filesystem as the
      # container sees it — bind a single parent (e.g. /mnt/pool/media:/media) and
      # point both dirs inside it. Two separate binds fall back to a copy-then-delete.
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # REQUIRED (same 0.0.0.0 bind as prod): serve refuses to start without a
      # token. Generate one: `openssl rand -hex 32`.
      # - DRUMDROP_API_TOKEN=<paste a 64-char hex token here>
      # Optional Plex library: each finished lesson folder is MOVED into this dir
      # (single copy) so Plex sees only finished files and /downloads is scratch.
      # Plex owns the path (no host-path mapping). See the single-parent bind-mount
      # note above for an instant, atomic move. A move failure is non-fatal.
      # - DRUMDROP_LIBRARY_DIR=/media/library
      # Optional Plex TV layout (requires DRUMDROP_LIBRARY_DIR): the library copy uses
      # Plex's TV-Shows naming — <library>/<Show>/Season 01/<Show> - s01e05 - Title.mp4
      # (sidecars share the episode base) — instead of the default Course/NN - Lesson
      # folders. In this layout the .nfo is a Kodi/Plex <episodedetails> doc (not
      # <movie>), carrying the episode title/showtitle/season/episode/aired/instructor.
      # On the PLEX side: create a *TV Shows* library pointing at DRUMDROP_LIBRARY_DIR
      # and switch its agent to one that reads .nfo files (the XBMCnfoTVImporter
      # plugin is what the working setup uses), then Refresh Metadata. The show will
      # not match TheTVDB, so episode titles must come from the local <episodedetails>
      # nfos; Local Media Assets alone was not enough in testing (Plex kept showing
      # "Episode N"). Empty/unset (or "default") keeps today's layout.
      # - DRUMDROP_LAYOUT=plex-tv
      # Set to the ABSOLUTE host path of ./downloads so the UI's "Copy path" gives
      # a host path you can paste into a file manager (else it shows /downloads).
      # - DRUMDROP_HOST_DOWNLOADS_DIR=/abs/path/to/drumdrop/downloads
    restart: unless-stopped

volumes:
  drumdrop-config:
