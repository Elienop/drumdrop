name: Release
on:
  push:
    branches: [main]
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # mathieudutour/github-tag-action has no Node 24 release — v6.2 is the latest
      # and even master still declares runs.using: node20. This opt-in flag runs
      # that JS action on the Node 24 runtime so it keeps working after GitHub
      # forces the switch (2026-06-16). The job's other actions are already Node
      # 24-ready, so the flag is a no-op for them. Drop this once the action ships
      # a release with runs.using: node24.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compute next version (dry run)
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          dry_run: true

      - name: Guard against an empty version
        run: |
          if [ -z "${{ steps.version.outputs.new_tag }}" ]; then
            echo "::error::no version bump computed (empty new_tag) — aborting"; exit 1
          fi

      - name: Create and push tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Fetch the new tag onto HEAD
        run: git fetch --tags --force

      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser (binaries + GitHub Release)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.new_tag }}

      - name: Build + push image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.new_tag }}
          tags: |
            ghcr.io/elienop/drumdrop:${{ steps.version.outputs.new_tag }}
            ghcr.io/elienop/drumdrop:latest
