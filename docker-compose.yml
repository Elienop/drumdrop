services:
  drumdrop:
    image: ghcr.io/elienop/drumdrop:latest
    container_name: drumdrop
    ports:
      - "3737:8080"
    volumes:
      - drumdrop-config:/config       # DB + AES-GCM secret + cookie
      - ./downloads:/downloads        # scratch for in-progress downloads (your
                                      # archive lands here when no library is set)
      # For the optional library (DRUMDROP_LIBRARY_DIR below), downloads and library
      # MUST be one filesystem AS THE CONTAINER SEES IT for an instant, atomic move
      # (a plain rename). Bind a single parent and point both dirs inside it, e.g.:
      #   - /mnt/pool/media:/media
      # then set DRUMDROP_DOWNLOADS_DIR=/media/downloads/drumdrop and
      # DRUMDROP_LIBRARY_DIR=/media/library. Two separate binds (as above) cross
      # filesystems inside the container and fall back to a copy-then-delete.
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # REQUIRED: the container binds 0.0.0.0, so serve refuses to start without
      # a token (GuardListen). Generate one: `openssl rand -hex 32`.
      # - DRUMDROP_API_TOKEN=<paste a 64-char hex token here>
      # Optional knobs (env-configured):
      # - DRUMDROP_INTERVAL=12h
      # - DRUMDROP_QUALITY=1080
      # - DRUMDROP_CORS_ORIGIN=https://drumdrop.example.com
      # Preferred audio-track language (ISO 639 code). Musora lessons increasingly
      # carry multiple audio renditions (English + Spanish/Portuguese dubs) and
      # yt-dlp's default pick can land on a dub (English intro, then dubbed body).
      # This makes yt-dlp prefer the audio tagged with this language OR untagged
      # (the original), falling back to its default pick only when no such track
      # exists. Defaults to "en"; set "any" (or "all") to disable the preference.
      # - DRUMDROP_AUDIO_LANG=en
      # Optional Plex library: when set, each finished lesson folder is MOVED into
      # this dir (single copy), so Plex watches a dir of ONLY finished files and
      # /downloads is pure scratch. Point Plex at the library; Plex owns the path
      # (no host-path mapping). See the single-parent bind-mount note above for an
      # instant, atomic move. A move failure is non-fatal (file stays in /downloads).
      # - DRUMDROP_LIBRARY_DIR=/media/library
      # Optional Plex TV layout (requires DRUMDROP_LIBRARY_DIR). With this set, the
      # library copy uses Plex's TV-Shows naming instead of the default
      # Course/NN - Lesson/... folders:
      #   <library>/<Show>/Season 01/<Show> - s01e05 - Lesson Title.mp4
      #   (sidecars — .nfo, .en.vtt, -poster.jpg — share the episode base, flat in
      #   the season folder). Show = the course (node follows), the lesson's parent
      #   course for instructor follows (else the instructor name), or content-<id>.
      # In this layout the .nfo is a Kodi/Plex <episodedetails> doc (not <movie>),
      # carrying the episode title/showtitle/season/episode/aired/instructor.
      # On the PLEX side: create a *TV Shows* library pointing at DRUMDROP_LIBRARY_DIR
      # and switch its agent to one that reads .nfo files (the XBMCnfoTVImporter
      # plugin is what the working setup uses), then Refresh Metadata. The show will
      # not match TheTVDB, so episode titles must come from the local <episodedetails>
      # nfos; Local Media Assets alone was not enough in testing (Plex kept showing
      # "Episode N"). Empty/unset (or "default") keeps today's layout.
      # - DRUMDROP_LAYOUT=plex-tv
      # Set this to the SAME host path you bind-mount to /downloads above, and the
      # UI's "Copy path" yields a host path (paste-ready in your file manager)
      # instead of the container's /downloads. Leave unset to keep container paths.
      # - DRUMDROP_HOST_DOWNLOADS_DIR=/srv/drumdrop/downloads
    restart: unless-stopped

volumes:
  drumdrop-config:
