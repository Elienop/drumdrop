# SonarQube analysis config for drumdrop (local Community Build server; run `sonar-scan`
# from this directory). No secrets here — the token and host come from the environment.
#
# Sources and tests both start at the repo root; the scanner turns sonar.test.inclusions
# into source exclusions automatically. sonar.exclusions filters the SOURCE scope only, so
# vendored trees are also listed in sonar.test.exclusions.
#
# Why each exclusion is there (the board is BACKLOG.md; the history is the owner's vault
# note drumdrop-sonarqube):
#   .claude/**                  Claude Code's local folder (gitignored) — not project code.
#   **/node_modules/**          installed third-party packages.
#   web/dist/**, dist/**        build output (the Vite bundle; make build / goreleaser).
#   downloads/**                runtime download scratch (gitignored).
#   web/src/components/ui/**    vendored shadcn primitives. Each file there has exactly one
#                               commit — the one that added it — and none has been edited
#                               since (check: `git log --name-status -- web/src/components/ui`
#                               lists only A lines). The day a file there is edited it becomes
#                               our code and the exclusion must be revisited (SpenDrop's test).
#                               Keeping it is an owner call: BACKLOG.md D29.
#   drumdrop                    the locally built binary at the repo root (gitignored).
#   docs/**                     prose, not code.
#   .github/**                  CI workflows: no analyzer on this server reads GitHub Actions
#                               workflows — revisit when one ships.

sonar.projectKey=drumdrop
sonar.projectName=drumdrop
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.test.exclusions=**/node_modules/**,web/dist/**,dist/**,downloads/**,.claude/**

sonar.exclusions=\
  .claude/**,**/node_modules/**,web/dist/**,dist/**,downloads/**,\
  web/src/components/ui/**,\
  drumdrop,\
  docs/**,.github/**

# Coverage: not produced yet, so these stay commented. `sonar-scan` runs `make coverage`
# first only when the Makefile has a `coverage:` target, and this repo has none yet —
# wiring it (Go cover profile + vitest lcov, plus the test-execution reports) is
# BACKLOG.md D18. Until then the scan reports 0% coverage, and the "Sonar way" gate's
# new-code coverage condition will fail on the first scan that has new lines.
# sonar.go.coverage.reportPaths=coverage.out
# sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
