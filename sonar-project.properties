# SonarQube analysis config for drumdrop (local Community Build server; run `sonar-scan`
# from this directory). No secrets here — the token and host come from the environment.
#
# Sources and tests both start at the repo root; the scanner turns sonar.test.inclusions
# into source exclusions automatically. sonar.exclusions filters the SOURCE scope only, so
# vendored trees are also listed in sonar.test.exclusions.
#
# Why each exclusion is there (the board is BACKLOG.md; the history is the owner's vault
# note drumdrop-sonarqube):
#   .claude/**                  Claude Code's local folder (gitignored) — not project code.
#   **/node_modules/**          installed third-party packages.
#   web/dist/**, dist/**        build output (the Vite bundle; make build / goreleaser).
#   downloads/**                runtime download scratch (gitignored).
#   coverage.out, go-test-report.json, web/coverage/**
#                               the test reports `make coverage` writes (see the end of
#                               this file): build output, never source. Excluding them
#                               does not stop the import: each sensor opens its report by
#                               the path its *.reportPaths names.
#   web/src/components/ui/**    vendored shadcn primitives: 14 files, plus sonner.test.tsx
#                               (a test, still analysed as one). 9 of the 14 are NOT
#                               untouched: alert-dialog, badge, button, checkbox, dialog,
#                               input, select, sonner and tabs each carry a "LOCAL EDIT"
#                               comment saying what changed and why (sonner's first edit
#                               came in PR #6, the rest in PR #21). SpenDrop's test says an
#                               edited primitive is our code and should be analysed, so by
#                               that test those 9 should not be excluded.
#                               How to check: `grep -l "LOCAL EDIT" web/src/components/ui/*`
#                               finds the marked edits; diff each file against the shadcn
#                               registry to catch an unmarked one. `git log` on main is not
#                               enough: PRs are squash-merged, so it hides an edit made and
#                               undone on a PR branch, and one made before a file's first
#                               commit never shows at all.
#                               Keep, narrow or drop this exclusion: owner call, BACKLOG.md D29.
#   drumdrop                    the locally built binary at the repo root (gitignored).
#   docs/**                     prose, not code.
#   .github/**                  CI workflows: no analyzer on this server reads GitHub Actions
#                               workflows — revisit when one ships.

sonar.projectKey=drumdrop
sonar.projectName=drumdrop
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.test.exclusions=**/node_modules/**,web/dist/**,dist/**,downloads/**,.claude/**

sonar.exclusions=\
  .claude/**,**/node_modules/**,web/dist/**,dist/**,downloads/**,\
  coverage.out,go-test-report.json,web/coverage/**,\
  web/src/components/ui/**,\
  drumdrop,\
  docs/**,.github/**

# TypeScript: name the web app's tsconfig files. Left to itself the analyzer finds every
# tsconfig.json on disk, exclusions or not, including one per agent worktree under
# .claude/worktrees/; with 38 of those it loaded them all and ran out of memory
# (2026-09-25). web/tsconfig.json references web/tsconfig.node.json.
sonar.typescript.tsconfigPaths=web/tsconfig.json,web/tsconfig.node.json

# Coverage and Go test results. `make coverage` (repo root) writes all three files, and the
# `sonar-scan` wrapper runs it before every upload; they are gitignored. Without them the
# scan reports 0% and the "Sonar way" gate fails its new-code coverage condition. Every
# source file counts toward coverage: code no test runs shows as uncovered, never excluded.
#   coverage.out                 Go cover profile (go test -coverprofile)
#   web/coverage/lcov.info       vitest's v8 coverage, paths relative to the repo root
#   go-test-report.json          the `go test -json` stream: test count, pass/fail, time
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.go.tests.reportPaths=go-test-report.json
